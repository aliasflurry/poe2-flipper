name = "price-checker"
main = "src/index.ts"
compatibility_date = "2025-08-30"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "price_checker"
database_name = "price-checker"
database_id = "71eb5e53-4c6f-4284-815f-45ddf3e4f54f"

[triggers]
crons = ["*/30 * * * *"]

[vars]
BUILD_VERSION = "dev"

# Set via: wrangler secret put ADMIN_REFRESH_TOKEN
