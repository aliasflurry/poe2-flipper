name: Update official exchange snapshots

on:
  workflow_dispatch:
  # Scheduled refreshes run in the Cloudflare Worker.
  # schedule:
  #   - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: exchange-snapshots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out snapshot branch
        run: git worktree add --detach snapshot-data origin/snapshots

      - name: Download official hourly markets
        run: node scripts/update-official-snapshots.mjs snapshot-data

      - name: Commit snapshots
        run: |
          git -C snapshot-data add data/poe_data/snapshot.json data/poe_data/price-history.json data/poe_data/item-catalog.json data/poe_data/unresolved-items.json data/poe2_data/snapshot.json data/poe2_data/price-history.json data/poe2_data/item-catalog.json data/poe2_data/unresolved-items.json
          if git -C snapshot-data diff --cached --quiet; then
            echo "No new exchange hour to publish."
            exit 0
          fi
          git -C snapshot-data config user.name "github-actions[bot]"
          git -C snapshot-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C snapshot-data commit -m "Update official exchange snapshots"
          git -C snapshot-data push origin HEAD:snapshots
