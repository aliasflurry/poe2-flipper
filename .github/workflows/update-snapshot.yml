name: Update poe2scout snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest snapshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data/poe2_data, data/poe_data | Out-Null
          $headers = @{
            accept = "application/json"
            origin = "https://poe2scout.com"
            referer = "https://poe2scout.com/"
          }

          $snapshots = @(
            @{
              source = "https://api.poe2scout.com/poe2/Leagues/runes/SnapshotPairs"
              path = "data/poe2_data/snapshot.json"
              historyPath = "data/poe2_data/price-history.json"
            },
            @{
              source = "https://api.poe2scout.com/pc/Leagues/allflame/SnapshotPairs"
              path = "data/poe_data/snapshot.json"
              historyPath = "data/poe_data/price-history.json"
            }
          )

          function Get-PriceMap($pairs) {
            $prices = [ordered]@{}
            foreach ($pair in $pairs) {
              $entries = @(
                @{ item = $pair.CurrencyOne; data = $pair.CurrencyOneData },
                @{ item = $pair.CurrencyTwo; data = $pair.CurrencyTwoData }
              )

              foreach ($entry in $entries) {
                $apiId = $entry.item.ApiId
                $price = [double]$entry.data.RelativePrice
                if ($apiId -and -not [double]::IsNaN($price) -and -not [double]::IsInfinity($price) -and $price -gt 0) {
                  $prices[$apiId] = $price
                }
              }
            }
            return $prices
          }

          function Get-PairMap($pairs) {
            $result = [ordered]@{}
            foreach ($pair in $pairs) {
              $oneId = $pair.CurrencyOne.ApiId
              $twoId = $pair.CurrencyTwo.ApiId
              if (-not $oneId -or -not $twoId) {
                continue
              }

              $onePrice = [double]$pair.CurrencyOneData.RelativePrice
              $twoPrice = [double]$pair.CurrencyTwoData.RelativePrice
              $volume = [double]$pair.Volume
              $isValid = -not [double]::IsNaN($onePrice) -and -not [double]::IsInfinity($onePrice) -and $onePrice -gt 0 `
                -and -not [double]::IsNaN($twoPrice) -and -not [double]::IsInfinity($twoPrice) -and $twoPrice -gt 0
              if (-not $isValid) {
                continue
              }

              $result["$oneId>$twoId"] = [pscustomobject]@{
                one = $oneId
                two = $twoId
                onePrice = $onePrice
                twoPrice = $twoPrice
                volume = $volume
              }
            }
            return $result
          }

          function Get-SnapshotPairs($payload) {
            if ($payload -is [array]) {
              return @($payload)
            }

            if ($payload.pairs) {
              if ($payload.pairs -is [array]) {
                return @($payload.pairs)
              }

              if ($payload.pairs.value) {
                return @($payload.pairs.value)
              }

              return @($payload.pairs)
            }

            if ($payload.value) {
              return @($payload.value)
            }

            return @($payload)
          }

          function Update-PriceHistory($path, $source, $updatedAt, $pairs) {
            $now = [datetime]$updatedAt
            $cutoff = $now.AddDays(-7)
            # Snapshots run every 30 minutes, but price history is only appended four times a day.
            $minGapHours = 5.5
            $snapshots = @()
            $lastAppendedAt = $null

            if (Test-Path -Path $path) {
              $existing = Get-Content -Path $path -Raw | ConvertFrom-Json
              if ($existing.snapshots) {
                $snapshots = @($existing.snapshots | Where-Object {
                  $_.updatedAt -and ([datetime]$_.updatedAt) -ge $cutoff
                })
                $lastAppendedAt = @(
                  $snapshots | ForEach-Object { [datetime]$_.updatedAt } | Sort-Object
                ) | Select-Object -Last 1
              }
            }

            if ($lastAppendedAt -and $lastAppendedAt -gt $now.AddHours(-$minGapHours)) {
              Write-Host "Skipping price-history append for $path; last entry $lastAppendedAt is within $minGapHours hours."
              return
            }

            $snapshots += [pscustomobject]@{
              updatedAt = $updatedAt
              prices = Get-PriceMap $pairs
              pairs = Get-PairMap $pairs
            }

            [pscustomobject]@{
              updatedAt = $updatedAt
              source = $source
              snapshots = $snapshots
            } | ConvertTo-Json -Depth 100 -Compress | Set-Content -Path $path -Encoding utf8NoBOM
          }

          foreach ($snapshot in $snapshots) {
            $source = $snapshot.source
            $pairsJson = (Invoke-WebRequest -Uri $source -Headers $headers).Content
            $payload = $pairsJson | ConvertFrom-Json
            $pairs = Get-SnapshotPairs $payload
            $updatedAt = (Get-Date).ToUniversalTime().ToString("o")
            [pscustomobject]@{
              updatedAt = $updatedAt
              source = $source
              pairs = ($pairsJson | ConvertFrom-Json)
            } | ConvertTo-Json -Depth 100 -Compress | Set-Content -Path $snapshot.path -Encoding utf8NoBOM
            Update-PriceHistory $snapshot.historyPath $source $updatedAt $pairs
          }

      - name: Commit snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update poe2scout snapshots
          file_pattern: data/poe2_data/snapshot.json data/poe_data/snapshot.json data/poe2_data/price-history.json data/poe_data/price-history.json
