name: Update poe2scout snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: snapshots

      - name: Download latest snapshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data/poe2_data, data/poe_data | Out-Null
          $headers = @{
            accept = "application/json"
            origin = "https://poe2scout.com"
            referer = "https://poe2scout.com/"
          }

          $snapshots = @(
            @{
              source = "https://api.poe2scout.com/poe2/Leagues/runes/SnapshotPairs"
              path = "data/poe2_data/snapshot.json"
              historyPath = "data/poe2_data/price-history.json"
            },
            @{
              source = "https://api.poe2scout.com/pc/Leagues/allflame/SnapshotPairs"
              path = "data/poe_data/snapshot.json"
              historyPath = "data/poe_data/price-history.json"
            }
          )

          function Get-PriceMap($pairs) {
            $prices = [ordered]@{}
            foreach ($pair in $pairs) {
              $entries = @(
                @{ item = $pair.CurrencyOne; data = $pair.CurrencyOneData },
                @{ item = $pair.CurrencyTwo; data = $pair.CurrencyTwoData }
              )

              foreach ($entry in $entries) {
                $apiId = $entry.item.ApiId
                $price = [double]$entry.data.RelativePrice
                if ($apiId -and -not [double]::IsNaN($price) -and -not [double]::IsInfinity($price) -and $price -gt 0) {
                  $prices[$apiId] = $price
                }
              }
            }
            return $prices
          }

          function Get-PairMap($pairs) {
            $result = [ordered]@{}
            foreach ($pair in $pairs) {
              $oneId = $pair.CurrencyOne.ApiId
              $twoId = $pair.CurrencyTwo.ApiId
              if (-not $oneId -or -not $twoId) {
                continue
              }

              $onePrice = [double]$pair.CurrencyOneData.RelativePrice
              $twoPrice = [double]$pair.CurrencyTwoData.RelativePrice
              $volume = [double]$pair.Volume
              $isValid = -not [double]::IsNaN($onePrice) -and -not [double]::IsInfinity($onePrice) -and $onePrice -gt 0 `
                -and -not [double]::IsNaN($twoPrice) -and -not [double]::IsInfinity($twoPrice) -and $twoPrice -gt 0
              if (-not $isValid) {
                continue
              }

              $result["$oneId>$twoId"] = [pscustomobject]@{
                one = $oneId
                two = $twoId
                onePrice = $onePrice
                twoPrice = $twoPrice
                volume = $volume
              }
            }
            return $result
          }

          function Get-SnapshotPairs($payload) {
            if ($payload -is [array]) {
              return @($payload)
            }

            if ($payload.pairs) {
              if ($payload.pairs -is [array]) {
                return @($payload.pairs)
              }

              if ($payload.pairs.value) {
                return @($payload.pairs.value)
              }

              return @($payload.pairs)
            }

            if ($payload.value) {
              return @($payload.value)
            }

            return @($payload)
          }

          function Get-ObjectProperty($object, $name) {
            if (-not $object -or -not $name) {
              return $null
            }
            return $object.PSObject.Properties[$name]
          }

          function Get-PairRate($snapshot, $fromId, $toId) {
            $direct = Get-ObjectProperty $snapshot.pairs "$fromId>$toId"
            if ($direct -and $direct.Value) {
              $onePrice = [double]$direct.Value.onePrice
              $twoPrice = [double]$direct.Value.twoPrice
              if ($twoPrice -ne 0 -and $onePrice -gt 0 -and $twoPrice -gt 0 -and -not [double]::IsNaN($onePrice) -and -not [double]::IsNaN($twoPrice) -and -not [double]::IsInfinity($onePrice) -and -not [double]::IsInfinity($twoPrice)) {
                $rate = $onePrice / $twoPrice
                if ($rate -gt 0 -and -not [double]::IsNaN($rate) -and -not [double]::IsInfinity($rate)) {
                  return $rate
                }
              }
            }

            $reverse = Get-ObjectProperty $snapshot.pairs "$toId>$fromId"
            if ($reverse -and $reverse.Value) {
              $onePrice = [double]$reverse.Value.onePrice
              $twoPrice = [double]$reverse.Value.twoPrice
              if ($onePrice -ne 0 -and $onePrice -gt 0 -and $twoPrice -gt 0 -and -not [double]::IsNaN($onePrice) -and -not [double]::IsNaN($twoPrice) -and -not [double]::IsInfinity($onePrice) -and -not [double]::IsInfinity($twoPrice)) {
                $rate = $twoPrice / $onePrice
                if ($rate -gt 0 -and -not [double]::IsNaN($rate) -and -not [double]::IsInfinity($rate)) {
                  return $rate
                }
              }
            }

            $fromProp = Get-ObjectProperty $snapshot.prices $fromId
            $toProp = Get-ObjectProperty $snapshot.prices $toId
            if ($fromProp -and $toProp) {
              $fromPrice = [double]$fromProp.Value
              $toPrice = [double]$toProp.Value
              if ($fromPrice -gt 0 -and $toPrice -gt 0 -and -not [double]::IsNaN($fromPrice) -and -not [double]::IsNaN($toPrice) -and -not [double]::IsInfinity($fromPrice) -and -not [double]::IsInfinity($toPrice)) {
                return $fromPrice / $toPrice
              }
            }

            return $null
          }

          function Get-TotalDifferences($snapshots) {
            $ordered = @($snapshots | Sort-Object { [datetime]$_.updatedAt })
            $pairKeys = [System.Collections.Generic.HashSet[string]]::new()
            foreach ($snapshot in $ordered) {
              if (-not $snapshot.pairs) {
                continue
              }
              foreach ($property in $snapshot.pairs.PSObject.Properties) {
                [void]$pairKeys.Add($property.Name)
              }
            }

            $totalDifferences = [ordered]@{}
            foreach ($key in $pairKeys) {
              $separator = $key.IndexOf(">")
              if ($separator -lt 1) {
                continue
              }
              $one = $key.Substring(0, $separator)
              $two = $key.Substring($separator + 1)
              if (-not $one -or -not $two) {
                continue
              }

              foreach ($direction in @(@($one, $two), @($two, $one))) {
                $fromId = $direction[0]
                $toId = $direction[1]
                $outKey = "$fromId>$toId"
                if ($totalDifferences.Contains($outKey)) {
                  continue
                }

                $previous = $null
                $total = 0.0
                $compared = 0
                foreach ($snapshot in $ordered) {
                  $rate = Get-PairRate $snapshot $fromId $toId
                  if ($null -eq $rate) {
                    continue
                  }
                  if ($null -ne $previous) {
                    $total += [math]::Abs($rate - $previous)
                    $compared += 1
                  }
                  $previous = $rate
                }

                if ($compared -gt 0) {
                  $totalDifferences[$outKey] = [math]::Round($total, 8)
                }
              }
            }

            return $totalDifferences
          }

          function Update-PriceHistory($path, $source, $updatedAt, $pairs) {
            $now = [datetime]$updatedAt
            $cutoff = $now.AddDays(-7)
            # Snapshots run every 30 minutes, but price history is only appended every 3 hours.
            $minGapHours = 2.5
            $snapshots = @()
            $lastAppendedAt = $null
            $existing = $null

            if (Test-Path -Path $path) {
              $existing = Get-Content -Path $path -Raw | ConvertFrom-Json
              if ($existing.snapshots) {
                $snapshots = @($existing.snapshots | Where-Object {
                  $_.updatedAt -and ([datetime]$_.updatedAt) -ge $cutoff
                })
                $lastAppendedAt = @(
                  $snapshots | ForEach-Object { [datetime]$_.updatedAt } | Sort-Object
                ) | Select-Object -Last 1
              }
            }

            $skipAppend = $lastAppendedAt -and $lastAppendedAt -gt $now.AddHours(-$minGapHours)
            if ($skipAppend) {
              Write-Host "Skipping price-history append for $path; last entry $lastAppendedAt is within $minGapHours hours."
            } else {
              $snapshots += [pscustomobject]@{
                updatedAt = $updatedAt
                prices = Get-PriceMap $pairs
                pairs = Get-PairMap $pairs
              }
            }

            $totalDifferences = Get-TotalDifferences $snapshots
            $historyUpdatedAt = if ($skipAppend -and $existing.updatedAt) { $existing.updatedAt } else { $updatedAt }
            Write-Host "Updating totalDifferences for $path ($($totalDifferences.Count) pair directions) from $($snapshots.Count) snapshots."
            [pscustomobject]@{
              updatedAt = $historyUpdatedAt
              source = $source
              totalDifferences = $totalDifferences
              snapshots = $snapshots
            } | ConvertTo-Json -Depth 100 -Compress | Set-Content -Path $path -Encoding utf8NoBOM
          }

          function Get-SnapshotDataJson($pairs) {
            return (@{
              prices = Get-PriceMap $pairs
              pairs = Get-PairMap $pairs
            } | ConvertTo-Json -Depth 100 -Compress)
          }

          foreach ($snapshot in $snapshots) {
            $source = $snapshot.source
            $pairsJson = (Invoke-WebRequest -Uri $source -Headers $headers).Content
            $payload = $pairsJson | ConvertFrom-Json
            $pairs = Get-SnapshotPairs $payload
            $newDataJson = Get-SnapshotDataJson $pairs
            $existingUpdatedAt = $null
            $dataChanged = $true

            if (Test-Path -Path $snapshot.path) {
              $existingFile = Get-Content -Path $snapshot.path -Raw | ConvertFrom-Json
              $existingUpdatedAt = $existingFile.updatedAt
              $existingPairs = Get-SnapshotPairs $existingFile.pairs
              $existingDataJson = Get-SnapshotDataJson $existingPairs
              $dataChanged = $newDataJson -ne $existingDataJson
            }

            if (-not $dataChanged) {
              Write-Host "No exchange data change for $($snapshot.path); keeping updatedAt $existingUpdatedAt."
              continue
            }

            $updatedAt = (Get-Date).ToUniversalTime().ToString("o")
            [pscustomobject]@{
              updatedAt = $updatedAt
              source = $source
              pairs = ($pairsJson | ConvertFrom-Json)
            } | ConvertTo-Json -Depth 100 -Compress | Set-Content -Path $snapshot.path -Encoding utf8NoBOM
            Update-PriceHistory $snapshot.historyPath $source $updatedAt $pairs
          }

      - name: Commit snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update poe2scout snapshots
          branch: snapshots
          file_pattern: data/poe2_data/snapshot.json data/poe_data/snapshot.json data/poe2_data/price-history.json data/poe_data/price-history.json
