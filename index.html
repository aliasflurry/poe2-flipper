<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PoE Exchange Path Finder</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace" data-game="poe2">
        <nav class="game-tabs" aria-label="Game">
          <button class="game-tab-button active" type="button" data-game="poe2" aria-pressed="true">Path of Exile 2</button>
          <button class="game-tab-button" type="button" data-game="poe" aria-pressed="false">Path of Exile</button>
        </nav>

        <header class="topbar">
          <div>
            <p id="gameEyebrow" class="eyebrow">Path of Exile 2</p>
            <h1>Exchange Path Finder</h1>
          </div>
          <div class="topbar-actions">
            <button id="resetOverridesButton" class="text-button" type="button">Reset overrides</button>
            <button id="refreshButton" class="icon-button" type="button" title="Refresh prices" aria-label="Refresh prices">
              <span aria-hidden="true">R</span>
            </button>
          </div>
        </header>

        <nav class="tabs" aria-label="Tools">
          <button class="tab-button active" type="button" data-tab="exchange" aria-pressed="true">Exchange</button>
          <button class="tab-button" type="button" data-tab="stash" aria-pressed="false">Stash</button>
          <button class="tab-button" type="button" data-tab="campaign" data-poe2-only aria-pressed="false">Campaign</button>
        </nav>

        <section id="exchangeView" class="tab-view active">
          <form class="controls" id="controls">
            <label>
              Start currency
              <select id="startCurrency"></select>
            </label>

            <label>
              Starting amount
              <input id="startAmount" type="number" min="0" step="0.01" value="1">
            </label>

            <label>
              Path length
              <select id="pathLength">
                <option value="both">2 and 3 trades</option>
                <option value="2">2 trades</option>
                <option value="3">3 trades</option>
              </select>
            </label>

            <label>
              Minimum volume
              <input id="minVolume" type="number" min="0" step="1" value="10">
            </label>

            <label>
              Minimum stock
              <input id="minStock" type="number" min="0" step="1" value="1">
            </label>

            <label>
              Max gold cost
              <input id="maxGoldCost" type="number" min="0" step="1" value="0">
            </label>

            <label>
              Per page
              <input id="pageSize" type="number" min="1" max="100" step="1" value="25">
            </label>

            <label class="exclude-field" for="excludeSearch">
              Exclude items
              <div class="exclude-picker">
                <div id="excludedChips" class="excluded-chips" aria-live="polite"></div>
                <input id="excludeSearch" list="excludeOptions" type="search" placeholder="Search item to exclude">
                <datalist id="excludeOptions"></datalist>
              </div>
            </label>
          </form>

          <section class="status-line" aria-live="polite">
            <span id="status">Loading exchange data...</span>
            <span id="snapshotMeta"></span>
          </section>

          <section class="sort-bar" aria-label="Sort results">
            <span>Sort by</span>
            <button class="sort-button active" type="button" data-sort="gain">Gain %</button>
            <button class="sort-button" type="button" data-sort="profit">Profit</button>
          </section>

          <section id="results" class="results"></section>
          <nav id="pagination" class="pagination" aria-label="Result pages"></nav>
        </section>

        <section id="stashView" class="tab-view">
          <form class="stash-controls" id="stashControls">
            <label>
              Account name
              <input id="stashAccount" type="text" autocomplete="username" placeholder="PoE account name">
            </label>

            <label>
              League
              <input id="stashLeague" type="text" value="Standard" placeholder="League name">
            </label>

            <label>
              Stash tab names
              <input id="stashTabNames" type="text" value="Currency, Essence, Delirium, Expedition, Breach, Ritual, Runes, Maps">
            </label>

            <button id="stashLookupButton" class="text-button primary-action" type="submit">Calculate stash</button>
          </form>

          <section class="status-line" aria-live="polite">
            <span id="stashStatus">Enter an account name to value public listings from matching stash tabs.</span>
            <span id="stashMeta"></span>
          </section>

          <section id="stashSummary" class="stash-summary"></section>
          <section id="stashResults" class="stash-results"></section>
        </section>

        <section id="campaignView" class="tab-view">
          <header class="campaign-header">
            <div class="campaign-header-left">
              <h2>Campaign Checklist</h2>
              <p id="campaignSummary" class="campaign-summary">Loading progress...</p>
              <div class="campaign-overall-progress" role="progressbar" aria-label="Overall progress">
                <div id="campaignOverallBar" class="campaign-overall-progress-fill" style="width:0%"></div>
              </div>
            </div>
            <div class="campaign-header-actions">
              <button id="campaignResetButton" class="text-button" type="button">Reset progress</button>
            </div>
          </header>

          <section class="campaign-status-line" aria-live="polite">
            <span id="campaignStatus"></span>
            <span id="campaignMeta"></span>
          </section>

          <section id="campaignActs" class="campaign-acts"></section>
        </section>
      </section>
    </main>

    <template id="resultTemplate">
      <article class="result-card">
        <div class="result-rank"></div>
        <div class="result-main">
          <div class="result-summary">
            <div>
              <h2></h2>
              <p class="path-text"></p>
            </div>
            <div class="result-metrics">
              <div class="metric">
                <span>Gain %</span>
                <strong class="gain"></strong>
              </div>
              <div class="metric">
                <span>Profit / 1M gold</span>
                <strong class="profit-score"></strong>
              </div>
            </div>
          </div>
          <ol class="steps"></ol>
        </div>
      </article>
    </template>

    <script src="campaign.js"></script>
    <script src="app.js"></script>
  </body>
</html>
